name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install "tomli>=1.1.0; python_version < '3.11'" "tree-sitter>=0.23" tree-sitter-python tree-sitter-javascript tree-sitter-typescript tree-sitter-go tree-sitter-java tree-sitter-rust
      - run: python -m unittest discover -s tests -t .
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - run: npm test
